# CrownClimb iPhone / iPad: compile, sign and upload to TestFlight on one of GitHub's Macs.
# Installed in the repository as .github/workflows/ios-testflight.yml by tools/ios/ios_build.py, which also uploads the
# Xcode project (written by Unity on Windows, BuildIOS.cs) as a zip to a draft release and starts this workflow.
#
# Repository secrets (Settings > Secrets and variables > Actions), from the Apple Developer account:
#   APPLE_TEAM_ID         10 characters, developer.apple.com > Membership details
#   ASC_KEY_ID            App Store Connect API key id
#   ASC_ISSUER_ID         App Store Connect API issuer id
#   ASC_KEY_P8            the contents of the AuthKey_<id>.p8 file
#   DIST_CERT_P12, DIST_CERT_PASSWORD, APPSTORE_PROFILE   made once by tools/ios/apple_signing.py
# The archive is built unsigned, then signed with that certificate and profile and uploaded with altool.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "id of the draft release that holds the Xcode project zip"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Download the Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/${{ inputs.release_id }} --jq '.assets[] | select(.name=="CrownClimb_Xcode.zip") | .id' > asset_id
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o xcode.zip "https://api.github.com/repos/${{ github.repository }}/releases/assets/$(cat asset_id)"
          ls -la xcode.zip
          ditto -x -k xcode.zip project
          # zipped on Windows: the scripts and Unity's tools lose their "executable" mark
          find project -name "*.sh" -exec chmod +x {} +
          find project/Il2CppOutputProject/IL2CPP/build -type f -exec chmod +x {} + 2>/dev/null || true
          find project/Frameworks -type f ! -name "*.*" -exec chmod +x {} + 2>/dev/null || true

      - name: Install the signing certificate and profile
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | tail -1      # only the count: the public log must not show names
          printf '%s' "$APPSTORE_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          # checks without printing names: where the profile is, and whether it belongs to the team
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          PTEAM=$(plutil -extract TeamIdentifier.0 raw "$RUNNER_TEMP/profile.plist")
          if [ "$PTEAM" = "$TEAM" ]; then echo "profile team matches"; else echo "PROFILE TEAM DIFFERS from APPLE_TEAM_ID"; exit 1; fi

      - name: Archive (signed with the App Store certificate and profile)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cd project
          # only the app itself gets the profile; Unity's frameworks are signed when they are embedded into it
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("Unity-iPhone.xcodeproj")
            p.targets.each do |t|
              t.build_configurations.each do |c|
                s = c.build_settings
                s["DEVELOPMENT_TEAM"] = ENV["TEAM"]
                s["CODE_SIGN_STYLE"] = "Manual"
                if t.name == "Unity-iPhone"
                  s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                  s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
                  s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_UUID"]
                  s["PROVISIONING_PROFILE"] = ENV["PROFILE_UUID"]
                else
                  s["CODE_SIGN_IDENTITY"] = ""
                  s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = ""
                  s["PROVISIONING_PROFILE_SPECIFIER"] = ""
                  s["PROVISIONING_PROFILE"] = ""
                end
              end
            end
            p.save
            puts "signing settings written for #{p.targets.map(&:name).join(", ")}"
          '
          xcodebuild archive -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/CrownClimb.xcarchive" | tail -300

      - name: Sign for the App Store
        run: |
          cat > export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.pioneer314.crownclimb</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CrownClimb.xcarchive" -exportOptionsPlist export.plist \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -t ios -f "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }} --output-format normal

      - name: Remove the signing files
        if: always()
        run: |
          rm -rf ~/private_keys
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Delete the uploaded Xcode project (kept after a failure, for a re-run)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE repos/${{ github.repository }}/releases/${{ inputs.release_id }} || true
